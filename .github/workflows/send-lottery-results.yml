name: Send Lottery Results

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  send-results:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout โค้ด (เหมือนเดิม)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 🔁 เปลี่ยนมาใช้ Action สำหรับ Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2 # ✨ ใช้ Action สำหรับ Bun โดยเฉพาะ
        with:
          bun-version: latest # หรือระบุเวอร์ชันที่ต้องการ

      # 3. 🔁 เปลี่ยนคำสั่งติดตั้งเป็น bun install
      - name: Install dependencies
        run: bun install --frozen-lockfile # ใช้ --frozen-lockfile เพื่อความปลอดภัยใน CI

      # 4. 🔁 เปลี่ยนคำสั่งรันสคริปต์เป็น bun run
      - name: Run send results script
        run: bun run send-lottery-results.ts # 🚀 Bun รันไฟล์ .ts ได้โดยตรง ไม่ต้องใช้ ts-node/tsx
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
