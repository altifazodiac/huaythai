name: Scrape and Import Lottery Data with Bun

on:
  schedule:
    # รันตามเวลา UTC ที่กำหนด (ตัวอย่าง: 03:00, 09:00, 15:00 UTC)
    - cron: '0 3,9,15 * * *'
  
  # อนุญาตให้รันด้วยตนเองได้จากหน้า Actions บน GitHub
  workflow_dispatch:

jobs:
  scrape-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        # ใช้ Action สำเร็จรูปสำหรับติดตั้ง Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies with Bun
        # Bun จะอ่าน package.json และติดตั้ง dependencies ทั้งหมด
        run: bun install

      - name: Install Playwright Browsers
        # ใช้ bunx ซึ่งเทียบเท่ากับ npx เพื่อรันคำสั่ง playwright
        run: bunx playwright install --with-deps chromium

      - name: Run Scrape and Import Script with Bun
        env:
          # Secrets ยังคงเหมือนเดิม
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        # Bun สามารถรันไฟล์ TypeScript ได้โดยตรง ไม่ต้องใช้ ts-node
        run: bun run ./import-lottery-results.ts